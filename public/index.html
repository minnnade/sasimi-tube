<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTubei.js & Cloudflare Player</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .search-box { margin-bottom: 20px; }
        input { padding: 12px; width: 60%; border-radius: 4px; border: none; font-size: 16px; }
        button { padding: 12px 24px; cursor: pointer; border-radius: 4px; border: none; background: #ff0000; color: white; font-weight: bold; font-size: 16px; }
        button:hover { background: #cc0000; }
        video { margin-top: 10px; width: 100%; max-width: 640px; background: black; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        /* 検索結果リストのスタイリング */
        #results { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; text-align: left; }
        .video-item { display: flex; gap: 15px; background: #333; padding: 12px; border-radius: 8px; cursor: pointer; transition: background 0.2s, transform 0.1s; }
        .video-item:hover { background: #444; transform: translateY(-2px); }
        .video-item img { width: 140px; height: auto; border-radius: 6px; object-fit: cover; }
        .video-title { font-size: 16px; font-weight: bold; margin: 0; align-self: center; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="container">
        <h1>YouTubei.js + Cloudflare Player</h1>
        
        <!-- 🔍 検索フォーム -->
        <div class="search-box">
            <input type="text" id="searchQuery" placeholder="動画のキーワードを入力...">
            <button onclick="searchVideos()">検索</button>
        </div>

        <!-- 📺 プレイヤー本体 -->
        <video id="player" controls autoplay></video>

        <!-- 📋 検索結果一覧 -->
        <div id="results"></div>
    </div>

    <script>
        // 🔗 作成してもらったCloudflare WorkersのURLをセット済です
        const CLOUDFLARE_WORKER_URL = 'https://round-glade-21e2.ahahadane.workers.dev/';

        // エンターキーでも検索できるようにする
        document.getElementById('searchQuery').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchVideos();
        });

        // 1. Renderサーバー（YouTubei.js）の検索APIを呼び出す
        async function searchVideos() {
            const query = document.getElementById('searchQuery').value;
            if (!query) return alert('キーワードを入力してください');

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p style="text-align:center;">検索中...</p>';

            try {
                // 自身のRenderサーバーから検索結果を取得
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const videos = await response.json();

                resultsDiv.innerHTML = ''; // リセット

                if (videos.length === 0) {
                    resultsDiv.innerHTML = '<p style="text-align:center;">動画が見つかりませんでした</p>';
                    return;
                }

                videos.forEach(video => {
                    const item = document.createElement('div');
                    item.className = 'video-item';
                    item.onclick = () => playVideo(video.id); // クリックでURL解析＆再生へ

                    item.innerHTML = `
                        <img src="${video.thumbnail}" alt="thumbnail">
                        <p class="video-title">${video.title}</p>
                    `;
                    resultsDiv.appendChild(item);
                });

            } catch (error) {
                console.error('Search error:', error);
                resultsDiv.innerHTML = '<p style="text-align:center; color:red;">検索中にエラーが発生しました</p>';
            }
        }

        // 2. Renderからgooglevideo URLを引っこ抜き、Cloudflare経由で再生する
        async function playVideo(videoId) {
            const videoElement = document.getElementById('player');
            
            try {
                // a. まずはRenderサーバーにgooglevideoの生URLを解析してもらう
                const response = await fetch(`/api/stream-url?id=${videoId}`);
                const data = await response.json();
                
                if (!data.url) {
                    alert('ストリームURLの取得に失敗しました');
                    return;
                }

                // b. CloudflareプロキシのURLに、解析したgooglevideo URLを埋め込んでvideoタグにセット！
                videoElement.src = `${CLOUDFLARE_WORKER_URL}?url=${encodeURIComponent(data.url)}`;
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch (error) {
                console.error('Error fetching stream url:', error);
                alert('動画の読み込み中にエラーが発生しました');
            }
        }
    </script>
</body>
</html>
